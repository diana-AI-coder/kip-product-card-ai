services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: kip-product-card-ai:latest
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2000}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-auto}
      LLM_MAX_REPAIRS: ${LLM_MAX_REPAIRS:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
